name: Local RAG regressions

on:
  pull_request:
    paths:
      - ".copilot/rag/**"
      - ".github/workflows/local-rag-regressions.yml"
  push:
    branches:
      - main
    paths:
      - ".copilot/rag/**"
      - ".github/workflows/local-rag-regressions.yml"

permissions:
  contents: read

jobs:
  windows-regressions:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run every Local RAG regression file
        run: python .copilot/rag/docs/tests/run_required_regressions.py
