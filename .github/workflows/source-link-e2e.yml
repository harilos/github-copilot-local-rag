name: Source-Link Live E2E

on:
  workflow_dispatch:
  push:
    tags:
      - "source-link-fixture/**"

permissions:
  contents: read

jobs:
  github-live-target:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run offline runner contracts
        run: >-
          python
          .copilot/rag/docs/tests/test_run_source_link_e2e.py
      - name: Resolve immutable fixture
        id: fixture
        shell: bash
        run: |
          fixture_ref="source-link-fixture/v1"
          fixture_commit="$(git rev-parse "${fixture_ref}^{commit}")"
          echo "ref=${fixture_ref}" >> "$GITHUB_OUTPUT"
          echo "commit=${fixture_commit}" >> "$GITHUB_OUTPUT"
      - name: Run GitHub Live Target E2E
        run: >-
          python
          .copilot/rag/docs/tests/run_source_link_e2e.py
          --provider github
          --repository-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          --ref "${{ steps.fixture.outputs.ref }}"
          --commit "${{ steps.fixture.outputs.commit }}"
          --url-reporting public
          --output "${RUNNER_TEMP}/github-source-link-e2e.jsonl"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: github-source-link-e2e
          path: ${{ runner.temp }}/github-source-link-e2e.jsonl
