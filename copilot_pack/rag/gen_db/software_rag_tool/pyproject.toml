[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "software-rag-tool"
version = "0.1.0"
description = "MIT-licensed local RAG tool for Japanese-first software knowledge"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "chromadb>=1.0.0",
  "numpy>=1.26.0",
  "sentence-transformers>=5.0.0",
  "pypdf>=5.0.0",
  "python-docx>=1.1.0",
  "python-pptx>=1.0.0",
  "openpyxl>=3.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["software_rag_tool*"]
