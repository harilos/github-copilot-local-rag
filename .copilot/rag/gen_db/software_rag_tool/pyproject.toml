[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "software-rag-tool"
version = "0.1.0"
description = "MIT-licensed local RAG tool for Japanese-first software knowledge"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "chromadb>=1.0.0",
  "numpy>=1.26.0",
  "sentence-transformers>=5.0.0",
  "transformers>=4.45.0",
  "onnx>=1.16.0",
  "onnxruntime>=1.18.0",
  "optimum[onnxruntime]>=1.23.0",
  "sentencepiece>=0.2.0",
  "SudachiPy>=0.6.10",
  "SudachiDict-core>=20240716",
  "pypdf>=5.0.0",
  "python-docx>=1.1.0",
  "python-pptx>=1.0.0",
  "openpyxl>=3.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["software_rag_tool*"]
