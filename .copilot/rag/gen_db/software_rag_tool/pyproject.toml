[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "software-rag-tool"
version = "0.1.0"
description = "MIT-licensed local RAG tool for Japanese-first software knowledge"
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = [
  "packaging==25.0",
  "chromadb==1.5.9",
  "numpy==2.3.2",
  "sentence-transformers==5.1.0",
  "transformers==4.55.2",
  "onnx==1.22.0",
  "onnxruntime==1.22.1",
  "optimum[onnxruntime]==2.0.0",
  "sentencepiece==0.2.1",
  "SudachiPy==0.6.10",
  "SudachiDict-core==20250515",
  "pypdf==6.0.0",
  "cryptography==45.0.6",
  "lxml==6.1.1",
  "python-docx==1.2.0",
  "python-pptx==1.0.2",
  "openpyxl==3.1.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["software_rag_tool*"]
